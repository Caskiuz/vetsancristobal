<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="vetGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="vetGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="vetGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="850" cy="200" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pawPrints" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <!-- Main paw pad -->
      <path d="M35 55c-2-6 2-14 8-18s12-2 16 3c2 4 2 8-2 12l-6 6c-3 3-8 5-14 2-4-2-2-5 0-5zm0 0c2-2 3-3 6-3" stroke="#0D9488" stroke-width="1.2" stroke-linecap="round" opacity="0.22"/>
      <!-- Toes -->
      <circle cx="33" cy="47" r="2.5" fill="#0D9488" opacity="0.18"/>
      <circle cx="40" cy="43" r="3" fill="#0D9488" opacity="0.16"/>
      <circle cx="30" cy="40" r="2.2" fill="#0D9488" opacity="0.20"/>
      <circle cx="28" cy="49" r="2.8" fill="#0D9488" opacity="0.14"/>
      <!-- Second paw -->
      <path d="M130 125c-2-6 2-14 8-18s12-2 16 3c2 4 2 8-2 12l-6 6c-3 3-8 5-14 2-4-2-2-5 0-5zm0 0c2-2 3-3 6-3" stroke="#0D9488" stroke-width="1.2" stroke-linecap="round" opacity="0.18"/>
      <circle cx="128" cy="117" r="2.5" fill="#0D9488" opacity="0.14"/>
      <circle cx="135" cy="113" r="3" fill="#0D9488" opacity="0.12"/>
      <circle cx="125" cy="110" r="2.2" fill="#0D9488" opacity="0.16"/>
    </pattern>
    <pattern id="crossPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <g opacity="0.06" transform="translate(100, 100)">
        <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#0D9488"/>
        <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#0D9488"/>
      </g>
    </pattern>
  </defs>
  <!-- Background layers -->
  <rect width="1200" height="800" fill="url(#vetGrad1)"/>
  <rect width="1200" height="800" fill="url(#vetGrad2)"/>
  <rect width="1200" height="800" fill="url(#sunGlow)"/>
  <rect width="1200" height="800" fill="url(#pawPrints)"/>
  <rect width="1200" height="800" fill="url(#crossPattern)"/>
  
  <!-- Curved wave decoration bottom -->
  <path d="M0 600 Q300 550 600 600 Q900 650 1200 580 L1200 800 L0 800 Z" fill="#0D9488" opacity="0.04"/>
  <path d="M0 650 Q400 620 800 660 Q1000 680 1200 640 L1200 800 L0 800 Z" fill="#14B8A6" opacity="0.03"/>
  
  <!-- Left side: Cat illustration -->
  <g transform="translate(220, 310)" opacity="0.65">
    <!-- Cat body -->
    <ellipse cx="0" cy="60" rx="60" ry="55" fill="#0D9488"/>
    <!-- Cat head -->
    <circle cx="-10" cy="0" r="32" fill="#0D9488"/>
    <!-- Left ear -->
    <path d="M-35 -15 L-28 -45 L-15 -18" fill="#0D9488"/>
    <!-- Right ear -->
    <path d="M-5 -15 L2 -45 L15 -18" fill="#0D9488"/>
    <!-- Inner ear -->
    <path d="M-32 -18 L-28 -38 L-18-18" fill="#14B8A6" opacity="0.6"/>
    <path d="M-2 -18 L2 -38 L12 -18" fill="#14B8A6" opacity="0.6"/>
    <!-- Eyes -->
    <ellipse cx="-20" cy="-2" rx="5" ry="5.5" fill="#CCFBF1" opacity="0.9"/>
    <ellipse cx="-20" cy="-2" rx="3" ry="4" fill="#0F766E"/>
    <ellipse cx="0" cy="-2" rx="5" ry="5.5" fill="#CCFBF1" opacity="0.9"/>
    <ellipse cx="0" cy="-2" rx="3" ry="4" fill="#0F766E"/>
    <!-- Nose -->
    <path d="M-12 8 L-10 12 L-8 8" fill="#FCA5A5" opacity="0.8"/>
    <!-- Whiskers -->
    <line x1="-30" y1="8" x2="-50" y2="4" stroke="#0D9488" stroke-width="0.8" opacity="0.4"/>
    <line x1="-30" y1="12" x2="-48" y2="12" stroke="#0D9488" stroke-width="0.8" opacity="0.4"/>
    <line x1="10" y1="8" x2="30" y2="4" stroke="#0D9488" stroke-width="0.8" opacity="0.4"/>
    <line x1="10" y1="12" x2="28" y2="12" stroke="#0D9488" stroke-width="0.8" opacity="0.4"/>
    <!-- Tail -->
    <path d="M40 40 Q70 20 65 -10 Q60 -30 70 -40" stroke="#0D9488" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Paws -->
    <ellipse cx="-30" cy="115" rx="12" ry="7" fill="#0D9488"/>
    <ellipse cx="30" cy="115" rx="12" ry="7" fill="#0D9488"/>
  </g>

  <!-- Right side: Dog illustration -->
  <g transform="translate(940, 300)" opacity="0.65">
    <!-- Dog body -->
    <ellipse cx="10" cy="75" rx="65" ry="50" fill="#0D9488"/>
    <!-- Dog head -->
    <circle cx="15" cy="20" r="30" fill="#0D9488"/>
    <!-- Snout -->
    <ellipse cx="5" cy="38" rx="18" ry="14" fill="#0D9488" opacity="0.8"/>
    <!-- Floppy ears -->
    <ellipse cx="-18" cy="25" rx="12" ry="22" fill="#0F766E" opacity="0.7" transform="rotate(-15 -18 25)"/>
    <ellipse cx="48" cy="25" rx="10" ry="18" fill="#0F766E" opacity="0.7" transform="rotate(15 48 25)"/>
    <!-- Eyes -->
    <circle cx="5" cy="10" r="5" fill="#CCFBF1" opacity="0.9"/>
    <circle cx="5" cy="10" r="2.5" fill="#0F766E"/>
    <circle cx="28" cy="10" r="5" fill="#CCFBF1" opacity="0.9"/>
    <circle cx="28" cy="10" r="2.5" fill="#0F766E"/>
    <!-- Nose -->
    <ellipse cx="2" cy="32" rx="6" ry="4" fill="#134E4A"/>
    <!-- Tongue -->
    <path d="M-2 40 Q-4 52 2 52 Q8 52 6 40" fill="#FCA5A5" opacity="0.6"/>
    <!-- Tail -->
    <path d="M70 55 Q95 40 100 20 Q105 5 95 0" stroke="#0D9488" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Legs -->
    <ellipse cx="-25" cy="125" rx="10" ry="18" fill="#0D9488"/>
    <ellipse cx="45" cy="125" rx="10" ry="18" fill="#0D9488"/>
    <!-- Collar -->
    <path d="M-12 35 Q15 52 40 35" stroke="#DC2626" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="15" cy="43" r="4" fill="#F59E0B" opacity="0.6"/>
  </g>

  <!-- Center: Veterinary medical cross shield -->
  <g transform="translate(580, 380)" opacity="0.75">
    <!-- Shield -->
    <path d="M0 -120 L80 -60 L80 40 Q40 100 0 130 Q-40 100 -80 40 L-80 -60 Z" fill="none" stroke="#0D9488" stroke-width="4" stroke-linejoin="round"/>
    <!-- Medical cross in shield -->
    <g transform="translate(0, -10)">
      <rect x="-12" y="-35" width="24" height="70" rx="5" fill="#14B8A6" opacity="0.8"/>
      <rect x="-35" y="-12" width="70" height="24" rx="5" fill="#14B8A6" opacity="0.8"/>
    </g>
    <!-- Stethoscope draped over -->
    <path d="M-50 -70 Q-70 -110 -40 -130 M-50 -70 Q-40 -80 -25 -75" stroke="#0D9488" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-40" cy="-130" r="12" fill="none" stroke="#0D9488" stroke-width="2.5"/>
    <path d="M50 -70 Q70 -110 40-130 M50 -70 Q40-80 25-75" stroke="#0D9488" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="-130" r="12" fill="none" stroke="#0D9488" stroke-width="2.5"/>
    <!-- Heart center -->
    <path d="M0 -5c-6-10-18-10-22-3s4 16 22 26c18-10 28-19 22-26s-16-7-22 3z" fill="#DC2626" opacity="0.35"/>
  </g>

  <!-- Stomach/Bird decorative element -->
  <g transform="translate(720, 600)" opacity="0.25">
    <ellipse cx="0" cy="20" rx="25" ry="18" fill="#14B8A6"/>
    <circle cx="-20" cy="-5" r="12" fill="#14B8A6"/>
    <path d="M-30 -10 L-42 -25 L-22 -15" fill="#14B8A6"/>
    <circle cx="-25" cy="-8" r="2" fill="#CCFBF1" opacity="0.7"/>
  </g>
  
  <!-- Small rabbit -->
  <g transform="translate(160, 600)" opacity="0.25">
    <ellipse cx="0" cy="20" rx="18" ry="22" fill="#0D9488"/>
    <circle cx="-8" cy="-5" r="12" fill="#0D9488"/>
    <ellipse cx="-18" cy="-25" rx="5" ry="14" fill="#0D9488"/>
    <ellipse cx="-3" cy="-27" rx="5" ry="12" fill="#0D9488" transform="rotate(10 -3 -27)"/>
  </g>

  <!-- Floating decorative circles -->
  <circle cx="150" cy="250" r="4" fill="#5EEAD4" opacity="0.15"/>
  <circle cx="400" cy="180" r="3" fill="#06B6D4" opacity="0.12"/>
  <circle cx="800" cy="150" r="5" fill="#14B8A6" opacity="0.10"/>
  <circle cx="1050" cy="220" r="3.5" fill="#5EEAD4" opacity="0.13"/>
  <circle cx="500" cy="700" r="4" fill="#0D9488" opacity="0.08"/>
  <circle cx="900" cy="650" r="3" fill="#06B6D4" opacity="0.10"/>
  
  <!-- Top decorative line -->
  <line x1="100" y1="30" x2="1100" y2="30" stroke="#0D9488" stroke-width="0.5" opacity="0.08"/>
</svg>