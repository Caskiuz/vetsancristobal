      <circle cx="48" cy="48" r="2.5" fill="#0D9488" opacity="0.1"/>
      <circle cx="36" cy="44" r="1.8" fill="#0D9488" opacity="0.14"/>
      <circle cx="32" cy="54" r="2.2" fill="#0D9488" opacity="0.08"/>
      <path d="M160 140c-2-8 2-18 8-22s14-2 18 4c2 4 2 10-2 14l-8 8c-4 4-10 6-16 2-6-2-2-6 0-6zm0 0c2-2 4-4 8-4" stroke="#0D9488" stroke-width="0.8" stroke-linecap="round" opacity="0.12"/>
      <circle cx="158" cy="132" r="2" fill="#0D9488" opacity="0.1"/>
      <circle cx="168" cy="128" r="2.5" fill="#0D9488" opacity="0.08"/>
      <circle cx="156" cy="124" r="1.8" fill="#0D9488" opacity="0.12"/>
