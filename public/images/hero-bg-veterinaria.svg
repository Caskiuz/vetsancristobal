  <path d="M500 650c20-40 60-60 100-40" stroke="#0D9488" stroke-width="3" stroke-linecap="round" opacity="0.06"/>
  <circle cx="610" cy="610" r="20" stroke="#0D9488" stroke-width="3" opacity="0.05"/>
