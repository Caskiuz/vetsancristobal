    <pattern id="hearts" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <path d="M60 80c-3-10 3-20 12-20s12 8 12 16c0 8-6 16-12 20-6-4-12-12-12-20z" fill="#14B8A6" opacity="0.06"/>
      <path d="M260 260c-3-10 3-20 12-20s12 8 12 16c0 8-6 16-12 20-6-4-12-12-12-20z" fill="#14B8A6" opacity="0.05"/>
    </pattern>
    <linearGradient id="vetGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="vetGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#vetGrad1)"/>
  <rect width="1200" height="800" fill="url(#vetGrad2)"/>
  <rect width="1200" height="800" fill="url(#paws)"/>
  <rect width="1200" height="800" fill="url(#hearts)"/>
  <!-- Dog silhouette decorative -->
  <ellipse cx="950" cy="500" rx="120" ry="80" fill="#0D9488" opacity="0.04" transform="rotate(-10 950 500)"/>
  <circle cx="1020" cy="430" r="50" fill="#0D9488" opacity="0.04"/>
