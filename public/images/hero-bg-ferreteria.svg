<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <!-- Main gradients -->
    <linearGradient id="ferreGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.09"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="ferreGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="ferreGlow" cx="600" cy="420" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint / grid pattern -->
    <pattern id="blueprint" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M40 0v40M0 40h40" stroke="#9A3412" stroke-width="0.3" opacity="0.08"/>
    </pattern>

    <!-- Diagonal tool marks -->
    <pattern id="toolMarks" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="60" y2="30" stroke="#EA580C" stroke-width="0.4" opacity="0.06"/>
      <circle cx="15" cy="15" r="1.5" fill="#F97316" opacity="0.08"/>
      <circle cx="45" cy="45" r="1" fill="#F97316" opacity="0.06"/>
    </pattern>

    <!-- Brick texture pattern -->
    <pattern id="brickPattern" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="none"/>
      <rect x="0" y="0" width="38" height="18" rx="2" fill="#9A3412" opacity="0.03"/>
      <rect x="42" y="0" width="38" height="18" rx="2" fill="#9A3412" opacity="0.03"/>
      <rect x="-20" y="20" width="38" height="18" rx="2" fill="#9A3412" opacity="0.025"/>
      <rect x="22" y="20" width="38" height="18" rx="2" fill="#9A3412" opacity="0.025"/>
      <rect x="64" y="20" width="38" height="18" rx="2" fill="#9A3412" opacity="0.025"/>
    </pattern>

    <filter id="ferreShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="800" fill="url(#ferreGrad1)"/>
  <rect width="1200" height="800" fill="url(#ferreGrad2)"/>
  <rect width="1200" height="800" fill="url(#ferreGlow)"/>
  <rect width="1200" height="800" fill="url(#blueprint)"/>
  <rect width="1200" height="800" fill="url(#toolMarks)"/>
  <rect width="1200" height="800" fill="url(#brickPattern)"/>

  <!-- Curved wave bottom -->
  <path d="M0 620 Q250 570 500 630 Q750 690 1000 620 Q1100 595 1200 610 L1200 800 L0 800 Z" fill="#C2410C" opacity="0.03"/>
  <path d="M0 650 Q300 610 600 660 Q900 710 1200 640 L1200 800 L0 800 Z" fill="#EA580C" opacity="0.02"/>

  <!-- Left: Hard hat illustration -->
  <g transform="translate(200, 320)" opacity="0.60">
    <!-- Hard hat body -->
    <ellipse cx="0" cy="10" rx="70" ry="22" fill="#F97316"/>
    <path d="M-65 10 Q-60 -35 -30 -45 Q0 -55 30 -45 Q60 -35 65 10" fill="#EA580C"/>
    <!-- Hat top ridge -->
    <path d="M-15 -48 Q0 -25 15 -48" stroke="#F97316" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Hat brim highlight -->
    <path d="M-60 8 Q-30 0 0 -2 Q30 0 60 8" stroke="#FDBA74" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- Hat shadow detail -->
    <ellipse cx="0" cy="12" rx="65" ry="10" fill="#9A3412" opacity="0.15"/>
    <!-- Worker silhouette head/face -->
    <circle cx="0" cy="25" r="16" fill="#D6D3D1" opacity="0.75"/>
    <ellipse cx="0" cy="35" rx="14" ry="10" fill="#A8A29E" opacity="0.5"/>
    <!-- Eyes -->
    <circle cx="-5" cy="22" r="2.5" fill="#44403C" opacity="0.6"/>
    <circle cx="5" cy="22" r="2.5" fill="#44403C" opacity="0.6"/>
    <!-- Slight smile -->
    <path d="M-5 28 Q0 32 5 28" stroke="#44403C" stroke-width="1.2" fill="none" opacity="0.5"/>
  </g>

  <!-- Right: Toolbox illustration -->
  <g transform="translate(950, 340)" opacity="0.55">
    <!-- Toolbox body -->
    <rect x="-65" y="-10" width="130" height="70" rx="8" fill="#9A3412"/>
    <rect x="-60" y="-5" width="120" height="60" rx="5" fill="#C2410C"/>
    <!-- Toolbox compartments -->
    <line x1="-30" y1="-5" x2="-30" y2="55" stroke="#7C2D12" stroke-width="2" opacity="0.5"/>
    <line x1="25" y1="-5" x2="25" y2="55" stroke="#7C2D12" stroke-width="2" opacity="0.5"/>
    <!-- Handle -->
    <path d="M-20 -10 Q0 -30 20 -10" stroke="#9A3412" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-20 -12 Q0 -32 20 -12" stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    <!-- Latches -->
    <rect x="-55" y="15" width="8" height="14" rx="2" fill="#FDBA74" opacity="0.6"/>
    <rect x="47" y="15" width="8" height="14" rx="2" fill="#FDBA74" opacity="0.6"/>
    <!-- Bottom shadow -->
    <rect x="-60" y="60" width="120" height="8" rx="4" fill="#7C2D12" opacity="0.4"/>
  </g>

  <!-- Center: House/building under construction -->
  <g transform="translate(580, 310)" opacity="0.70" filter="url(#ferreShadow)">
    <!-- Building base / scaffolding -->
    <rect x="-70" y="-100" width="140" height="190" rx="3" fill="#A8A29E" opacity="0.25"/>
    
    <!-- Scaffolding poles left -->
    <rect x="-75" y="-110" width="5" height="210" rx="2" fill="#D97706" opacity="0.8"/>
    <rect x="-75" y="-110" width="5" height="8" rx="1" fill="#F97316" opacity="0.6"/>
    <rect x="-75" y="95" width="5" height="8" rx="1" fill="#F97316" opacity="0.6"/>
    
    <!-- Scaffolding poles right -->
    <rect x="70" y="-110" width="5" height="210" rx="2" fill="#D97706" opacity="0.8"/>
    <rect x="70" y="-110" width="5" height="8" rx="1" fill="#F97316" opacity="0.6"/>
    <rect x="70" y="95" width="5" height="8" rx="1" fill="#F97316" opacity="0.6"/>
    
    <!-- Horizontal scaffold bars -->
    <rect x="-75" y="-100" width="150" height="5" rx="2" fill="#D97706" opacity="0.7"/>
    <rect x="-75" y="-30" width="150" height="5" rx="2" fill="#D97706" opacity="0.7"/>
    <rect x="-75" y="40" width="150" height="5" rx="2" fill="#D97706" opacity="0.7"/>
    <rect x="-75" y="90" width="150" height="5" rx="2" fill="#D97706" opacity="0.7"/>

    <!-- Building structure -->
    <rect x="-65" y="-85" width="130" height="175" rx="2" fill="#FDBA74" opacity="0.15"/>
    
    <!-- Walls -->
    <rect x="-60" y="-80" width="58" height="165" fill="#FED7AA" opacity="0.25" rx="2"/>
    <rect x="2" y="-80" width="58" height="165" fill="#FED7AA" opacity="0.2" rx="2"/>
    
    <!-- Door -->
    <rect x="-15" y="20" width="30" height="65" rx="3" fill="#9A3412" opacity="0.35"/>
    <circle cx="10" cy="52" r="2.5" fill="#F97316" opacity="0.5"/>

    <!-- Windows -->
    <rect x="-50" y="-50" width="22" height="22" rx="2" fill="#BAE6FD" opacity="0.2" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
    <line x1="-39" y1="-50" x2="-39" y2="-28" stroke="#D97706" stroke-width="1" opacity="0.5"/>
    <line x1="-50" y1="-39" x2="-28" y2="-39" stroke="#D97706" stroke-width="1" opacity="0.5"/>

    <rect x="28" y="-50" width="22" height="22" rx="2" fill="#BAE6FD" opacity="0.2" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
    <line x1="39" y1="-50" x2="39" y2="-28" stroke="#D97706" stroke-width="1" opacity="0.5"/>
    <line x1="28" y1="-39" x2="50" y2="-39" stroke="#D97706" stroke-width="1" opacity="0.5"/>

    <!-- Roof under construction -->
    <rect x="-65" y="-90" width="130" height="12" rx="1" fill="#C2410C" opacity="0.4"/>
    <polygon points="-70,-90 0,-130 70,-90" fill="#EA580C" opacity="0.3"/>
    
    <!-- Roof tiles being placed -->
    <rect x="-60" y="-88" width="14" height="6" rx="1" fill="#C2410C" opacity="0.5"/>
    <rect x="-42" y="-88" width="14" height="6" rx="1" fill="#C2410C" opacity="0.4"/>
    <rect x="-24" y="-88" width="14" height="6" rx="1" fill="#C2410C" opacity="0.45"/>
    <rect x="-6" y="-88" width="14" height="6" rx="1" fill="#C2410C" opacity="0.35"/>
    <rect x="12" y="-88" width="14" height="6" rx="1" fill="#C2410C" opacity="0.4"/>
    <rect x="30" y="-88" width="14" height="6" rx="1" fill="#C2410C" opacity="0.45"/>
    <rect x="48" y="-88" width="14" height="6" rx="1" fill="#C2410C" opacity="0.5"/>

    <!-- Crane / pulley system on top -->
    <line x1="0" y1="-130" x2="0" y2="-160" stroke="#D97706" stroke-width="3" opacity="0.7"/>
    <line x1="-8" y1="-135" x2="8" y2="-135" stroke="#F97316" stroke-width="4" opacity="0.5"/>
    <!-- Pulley wheel -->
    <circle cx="0" cy="-138" r="6" fill="none" stroke="#C2410C" stroke-width="2.5" opacity="0.6"/>
    <circle cx="0" cy="-138" r="2" fill="#EA580C" opacity="0.5"/>
    <!-- Cable -->
    <line x1="0" y1="-138" x2="0" y2="-155" stroke="#A8A29E" stroke-width="1.5" opacity="0.6"/>
    <!-- Hook -->
    <path d="M-8 -155 L-3 -148 L3 -148" stroke="#A8A29E" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Bricks being lifted -->
    <rect x="-8" y="-148" width="16" height="10" rx="1.5" fill="#C2410C" opacity="0.5"/>
    <line x1="-8" y1="-143" x2="8" y2="-143" stroke="#9A3412" stroke-width="0.8" opacity="0.4"/>
    <line x1="-8" y1="-138" x2="8" y2="-138" stroke="#9A3412" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Top decorative strip: Tools -->
  <g opacity="0.30">
    <!-- Wrench -->
    <g transform="translate(250, 25)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#D97706" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="4" fill="#D97706" opacity="0.4"/>
      <line x1="8" y1="0" x2="30" y2="0" stroke="#D97706" stroke-width="2.5"/>
      <line x1="28" y1="-6" x2="28" y2="6" stroke="#D97706" stroke-width="2"/>
    </g>
    <!-- Hammer -->
    <g transform="translate(450, 30)">
      <rect x="-12" y="-4" width="24" height="8" rx="2" fill="#C2410C" opacity="0.8"/>
      <rect x="-2" y="-12" width="4" height="24" rx="1" fill="#D97706" opacity="0.7"/>
      <rect x="-3" y="-14" width="6" height="28" rx="2" fill="none" stroke="#C2410C" stroke-width="0.8" opacity="0.5"/>
    </g>
    <!-- Screwdriver -->
    <g transform="translate(650, 22)">
      <rect x="-3" y="-2" width="6" height="30" rx="1.5" fill="#D97706" opacity="0.7"/>
      <rect x="-2" y="-2" width="4" height="8" rx="0.5" fill="#F97316" opacity="0.5"/>
      <rect x="-2" y="-4" width="4" height="4" rx="1" fill="#A8A29E" opacity="0.6"/>
      <rect x="-2" y="26" width="4" height="10" rx="1" fill="#EA580C" opacity="0.6"/>
    </g>
    <!-- Measuring tape -->
    <g transform="translate(850, 28)">
      <circle cx="0" cy="0" r="10" fill="#EAB308" opacity="0.6"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#CA8A04" stroke-width="1.5" opacity="0.5"/>
      <rect x="8" y="-3" width="20" height="6" rx="1" fill="#FBBF24" opacity="0.5"/>
      <line x1="10" y1="0" x2="26" y2="0" stroke="#CA8A04" stroke-width="0.6" opacity="0.4"/>
    </g>
    <!-- Saw -->
    <g transform="translate(1020, 28)">
      <rect x="-30" y="-2" width="30" height="4" rx="1" fill="#D97706" opacity="0.6"/>
      <rect x="-30" y="-3" width="10" height="6" rx="0.5" fill="#A8A29E" opacity="0.5"/>
      <line x1="-28" y1="-3" x2="-28" y2="3" stroke="#F97316" stroke-width="0.8" opacity="0.5"/>
      <line x1="-24" y1="-3" x2="-24" y2="3" stroke="#F97316" stroke-width="0.8" opacity="0.5"/>
      <line x1="-20" y1="-3" x2="-20" y2="3" stroke="#F97316" stroke-width="0.8" opacity="0.5"/>
      <line x1="-16" y1="-3" x2="-16" y2="3" stroke="#F97316" stroke-width="0.8" opacity="0.5"/>
      <line x1="-12" y1="-3" x2="-12" y2="3" stroke="#F97316" stroke-width="0.8" opacity="0.5"/>
      <line x1="-8" y1="-3" x2="-8" y2="3" stroke="#F97316" stroke-width="0.8" opacity="0.5"/>
      <line x1="-4" y1="-3" x2="-4" y2="3" stroke="#F97316" stroke-width="0.8" opacity="0.5"/>
    </g>
  </g>

  <!-- Pipe and plumbing elements bottom left -->
  <g transform="translate(120, 650)" opacity="0.30">
    <rect x="0" y="0" width="60" height="10" rx="5" fill="#D97706" opacity="0.6"/>
    <rect x="0" y="22" width="60" height="10" rx="5" fill="#D97706" opacity="0.4"/>
    <line x1="15" y1="10" x2="15" y2="22" stroke="#D97706" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    <line x1="45" y1="10" x2="45" y2="22" stroke="#D97706" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    <!-- Faucet hint -->
    <path d="M60 5 Q75 5 75 -10 Q75 -20 65 -20" stroke="#A8A29E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Electrical elements bottom right -->
  <g transform="translate(1000, 660)" opacity="0.30">
    <rect x="0" y="0" width="50" height="35" rx="4" fill="#D97706" opacity="0.5"/>
    <rect x="4" y="4" width="42" height="27" rx="2" fill="#FED7AA" opacity="0.3"/>
    <!-- Breaker switches -->
    <rect x="8" y="8" width="12" height="6" rx="1" fill="#EA580C" opacity="0.5"/>
    <rect x="24" y="8" width="12" height="6" rx="1" fill="#22C55E" opacity="0.4"/>
    <rect x="8" y="18" width="12" height="6" rx="1" fill="#EA580C" opacity="0.5"/>
    <rect x="24" y="18" width="12" height="6" rx="1" fill="#EA580C" opacity="0.4"/>
    <!-- Lightbulb -->
    <g transform="translate(32, -5) scale(0.8)">
      <path d="M-6 12 Q-10 8 -10 0 Q-10 -8 0 -12 Q10 -8 10 0 Q10 8 6 12 Z" fill="#FBBF24" opacity="0.5"/>
      <rect x="-1" y="12" width="2" height="3" rx="0.5" fill="#D97706" opacity="0.6"/>
    </g>
  </g>

  <!-- Decorative sparks / particles -->
  <circle cx="180" cy="280" r="2.5" fill="#F97316" opacity="0.10"/>
  <circle cx="920" cy="250" r="3" fill="#EA580C" opacity="0.08"/>
  <circle cx="350" cy="180" r="2" fill="#F97316" opacity="0.07"/>
  <circle cx="1050" cy="400" r="2.5" fill="#D97706" opacity="0.09"/>
  <circle cx="150" cy="500" r="2" fill="#EA580C" opacity="0.06"/>
  <circle cx="880" cy="560" r="2" fill="#F97316" opacity="0.07"/>

  <!-- Nail/screw small decorations scattered -->
  <g opacity="0.12">
    <circle cx="330" cy="620" r="3" fill="#A8A29E"/>
    <line x1="327" y1="620" x2="333" y2="620" stroke="#78716C" stroke-width="1"/>
    <circle cx="530" cy="680" r="2.5" fill="#A8A29E"/>
    <line x1="528" y1="680" x2="533" y2="680" stroke="#78716C" stroke-width="0.8"/>
    <circle cx="730" cy="640" r="2" fill="#A8A29E"/>
    <line x1="728" y1="640" x2="732" y2="640" stroke="#78716C" stroke-width="0.7"/>
    <circle cx="830" cy="700" r="2.5" fill="#A8A29E"/>
    <line x1="828" y1="700" x2="833" y2="700" stroke="#78716C" stroke-width="0.8"/>
  </g>

  <!-- Paint bucket far right corner -->
  <g transform="translate(1080, 580) scale(0.5)" opacity="0.25">
    <path d="M-20 -10 L-15 20 L15 20 L20 -10 Z" fill="#EA580C"/>
    <ellipse cx="0" cy="-10" rx="20" ry="6" fill="#C2410C"/>
    <path d="M-10 -30 Q0 -40 10 -30" stroke="#A8A29E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-8" y="-29" width="16" height="4" rx="2" fill="#F97316" opacity="0.6"/>
  </g>
</svg>