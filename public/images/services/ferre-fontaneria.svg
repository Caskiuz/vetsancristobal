    <rect x="115" y="120" width="30" height="10" rx="3" fill="#94A3B8"/>
    <path d="M118 120c-5-15 5-25 12-22s8 15 2 22" stroke="#94A3B8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="130" cy="100" r="6" fill="#06B6D4" opacity="0.7"/>
    <!-- Water drop -->
    <path d="M130 110c0-4 3-6 4-3s3 6 0 8-4 2-4-5z" fill="#38BDF8" opacity="0.8"/>
  </g>
  <!-- Wrench on pipe -->
