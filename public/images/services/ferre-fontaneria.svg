<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" opacity="0.15"/>
  <defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284C7"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient></defs>
  <!-- Pipe elbow -->
  <g opacity="0.85">
    <rect x="55" y="55" width="12" height="55" rx="4" fill="#0284C7" opacity="0.8"/>
    <rect x="60" y="85" width="60" height="12" rx="4" fill="#06B6D4" opacity="0.8"/>
    <!-- Elbow joint -->
    <path d="M67 55c0-10 10-15 18-10l56 40c8 6 5 18-5 20" stroke="#0284C7" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Faucet -->
