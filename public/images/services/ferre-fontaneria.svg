    <rect x="0" y="0" width="6" height="30" rx="2" fill="#64748B"/>
    <circle cx="3" cy="5" r="10" fill="none" stroke="#64748B" stroke-width="3"/>
  </g>
  <!-- Water drops -->
  <g opacity="0.3">
    <path d="M180 155c0-6 4-8 6-4s4 8 0 12-6 2-6-8z" fill="#38BDF8"/>
    <path d="M30 160c0-4 2-6 4-3s2 6 0 8-4 2-4-5z" fill="#38BDF8"/>
  </g>
</svg>