<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" opacity="0.15"/>
  <defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3F3F46"/><stop offset="100%" stop-color="#52525B"/></linearGradient></defs>
  <!-- Padlock -->
  <g opacity="0.85">
    <rect x="65" y="75" width="60" height="55" rx="8" fill="#3F3F46"/>
    <rect x="68" y="78" width="54" height="49" rx="6" fill="#52525B" opacity="0.7"/>
    <!-- Shackle -->
    <path d="M77 75c0-25 36-25 36 0" stroke="#3F3F46" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M77 75c0-22 30-22 30 0" stroke="#52525B" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Keyhole -->
    <circle cx="95" cy="98" r="7" fill="none" stroke="#EAB308" stroke-width="2.5"/>
    <rect x="92" y="102" width="6" height="12" rx="2" fill="none" stroke="#EAB308" stroke-width="2.5"/>
  </g>
  <!-- Key -->
  <g opacity="0.8" transform="translate(40, 100) rotate(-30)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#EAB308" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#EAB308" stroke-width="1.5" opacity="0.5"/>
    <rect x="-10" y="-2" width="30" height="4" rx="2" fill="#EAB308"/>
    <rect x="16" y="-4" width="6" height="8" rx="1.5" fill="#EAB308"/>
    <rect x="20" y="-4" width="5" height="8" rx="1.5" fill="#EAB308"/>
  </g>
  <!-- Hinge -->
  <g opacity="0.6">
    <rect x="120" y="130" width="35" height="8" rx="2" fill="#3F3F46"/>
    <rect x="125" y="138" width="8" height="22" rx="2" fill="#52525B"/>
    <circle cx="129" cy="142" r="2.5" fill="#EAB308" opacity="0.5"/>
    <circle cx="129" cy="152" r="2.5" fill="#EAB308" opacity="0.5"/>
  </g>
  <!-- Doorknob -->
  <g opacity="0.5">
    <circle cx="160" cy="80" r="12" fill="#3F3F46"/>
    <circle cx="160" cy="80" r="7" fill="#52525B" opacity="0.6"/>
    <circle cx="160" cy="80" r="3" fill="#EAB308" opacity="0.4"/>
    <rect x="152" y="78" width="8" height="4" rx="1" fill="#3F3F46"/>
  </g>
  <!-- Small screws decorative -->
  <g opacity="0.2">
    <circle cx="30" cy="50" r="3" fill="#3F3F46"/>
    <line x1="27" y1="50" x2="33" y2="50" stroke="#52525B" stroke-width="1"/>
    <line x1="30" y1="47" x2="30" y2="53" stroke="#52525B" stroke-width="1"/>
  </g>
</svg>