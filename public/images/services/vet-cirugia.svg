<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" opacity="0.15"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Surgical lamp -->
  <g opacity="0.9">
    <rect x="40" y="30" width="120" height="12" rx="6" fill="#0D9488"/>
    <rect x="70" y="42" width="8" height="15" fill="#0D9488"/>
    <circle cx="74" cy="65" r="22" fill="none" stroke="#0D9488" stroke-width="2.5"/>
    <circle cx="74" cy="65" r="14" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.5"/>
    <line x1="52" y1="65" x2="96" y2="65" stroke="#06B6D4" stroke-width="1.5" opacity="0.4"/>
    <line x1="74" y1="43" x2="74" y2="87" stroke="#06B6D4" stroke-width="1.5" opacity="0.4"/>
    <!-- Light rays -->
    <path d="M56 78l-12 16m20-12l-8 20m36-20l8 20m16-16l12 16" stroke="#14B8A6" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  </g>
  <!-- Surgical table -->
  <rect x="40" y="145" width="120" height="10" rx="5" fill="#0D9488" opacity="0.8"/>
  <rect x="75" y="120" width="50" height="30" rx="8" fill="#0D9488" opacity="0.15" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Cross / Medical symbol -->
  <g transform="translate(100, 100)">
    <rect x="-4" y="-16" width="8" height="32" rx="2" fill="#0D9488" opacity="0.7"/>
    <rect x="-16" y="-4" width="32" height="8" rx="2" fill="#0D9488" opacity="0.7"/>
  </g>
  <!-- Instruments -->
  <path d="M145 75 L160 65" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="160" cy="65" r="3" fill="#0D9488"/>
  <path d="M145 85 L158 92" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 95 L40 105 M40 95 L55 105" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>