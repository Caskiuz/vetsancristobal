    <path d="M60 98l-3-8M68 95l2-6M120 96l4-7M130 100l-2-8" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
    <circle cx="65" cy="102" r="2.5" fill="#F59E0B"/>
    <circle cx="125" cy="98" r="2" fill="#F97316"/>
    <circle cx="80" cy="92" r="1.5" fill="#F59E0B"/>
