  <!-- Bowl -->
  <g opacity="0.85">
    <ellipse cx="95" cy="115" rx="45" ry="30" fill="#047857" opacity="0.6"/>
    <ellipse cx="95" cy="110" rx="45" ry="8" fill="#065F46" opacity="0.8"/>
    <rect x="50" y="95" width="90" height="20" rx="5" fill="#047857" opacity="0.9"/>
    <ellipse cx="95" cy="95" rx="45" ry="10" fill="#059669" opacity="0.7"/>
  </g>
  <!-- Meat pieces in bowl -->
  <g opacity="0.8">
    <ellipse cx="78" cy="105" rx="12" ry="7" fill="#B91C1C" opacity="0.8" transform="rotate(-15 78 105)"/>
    <ellipse cx="110" cy="100" rx="14" ry="6" fill="#DC2626" opacity="0.7" transform="rotate(10 110 100)"/>
    <ellipse cx="95" cy="108" rx="10" ry="5" fill="#F59E0B" opacity="0.7"/>
  </g>
  <!-- Herbs and spices -->
