<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" opacity="0.15"/>
  <defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10B981"/></linearGradient></defs>
  <!-- Parrot/bird silhouette -->
  <g opacity="0.8">
    <ellipse cx="90" cy="100" rx="30" ry="35" fill="#059669"/>
    <circle cx="75" cy="72" r="18" fill="#059669"/>
    <!-- Beak -->
    <path d="M58 72l-12-3 8-4z" fill="#F59E0B" opacity="0.8"/>
    <!-- Eye -->
    <circle cx="70" cy="68" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="70" cy="68" r="1.5" fill="#059669"/>
    <!-- Wing -->
    <path d="M95 85c15 5 30 15 25 35s-15 25-25 10" fill="#10B981" opacity="0.6"/>
    <!-- Tail feathers -->
    <path d="M88 130c-5 20-15 35-25 30m-2-28c-8 18-20 30-25 25m5-22c-12 15-22 22-28 15" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Small decorations: lizard -->
  <g opacity="0.5">
    <path d="M140 150c0-8 5-12 10-8s6 10 2 14" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M148 148l12-5m8-2l6-8" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Rabbit silhouette -->
  <g opacity="0.4">
    <ellipse cx="145" cy="100" rx="20" ry="25" fill="#10B981"/>
    <circle cx="140" cy="78" r="14" fill="#10B981"/>
    <ellipse cx="128" cy="58" rx="5" ry="12" fill="#10B981"/>
    <ellipse cx="145" cy="60" rx="5" ry="10" fill="#10B981" transform="rotate(15 145 60)"/>
  </g>
</svg>