<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" opacity="0.15"/>
  <defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#DC2626"/><stop offset="100%" stop-color="#EF4444"/></linearGradient></defs>
  <!-- Delivery truck -->
  <g opacity="0.85">
    <!-- Truck body -->
    <rect x="40" y="85" width="85" height="40" rx="6" fill="#B91C1C" opacity="0.8"/>
    <!-- Cabin -->
    <path d="M90 95 L90 70 L115 70 Q125 70 125 80 L125 95" fill="#DC2626" opacity="0.9"/>
    <!-- Windshield -->
    <path d="M95 77 L110 77 Q115 77 115 82 L95 82" fill="#FEF2F2" opacity="0.3"/>
    <!-- Cargo box -->
    <rect x="45" y="60" width="42" height="30" rx="3" fill="#991B1B" opacity="0.6"/>
    <!-- Meat box icon on cargo -->
    <rect x="52" y="66" width="28" height="18" rx="3" fill="#DC2626" opacity="0.5"/>
    <path d="M58 72 L66 72 M58 78 L72 78" stroke="#FCA5A5" stroke-width="1" opacity="0.5"/>
    <!-- Wheels -->
    <circle cx="65" cy="130" r="14" fill="#1F2937" opacity="0.9"/>
    <circle cx="65" cy="130" r="7" fill="#6B7280" opacity="0.6"/>
    <circle cx="105" cy="130" r="14" fill="#1F2937" opacity="0.9"/>
    <circle cx="105" cy="130" r="7" fill="#6B7280" opacity="0.6"/>
    <!-- Speed lines -->
    <g opacity="0.3">
      <line x1="135" y1="95" x2="150" y2="95" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/>
      <line x1="138" y1="102" x2="160" y2="102" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/>
      <line x1="135" y1="109" x2="155" y2="109" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Map pin -->
  <g opacity="0.6">
    <path d="M45 155c0-8 6-14 14-14s14 6 14 14c0 10-14 20-14 20s-14-10-14-20z" fill="#DC2626"/>
    <circle cx="59" cy="155" r="5" fill="#fff" opacity="0.8"/>
  </g>
  <!-- Clock -->
  <g opacity="0.5">
    <circle cx="160" cy="155" r="16" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="160" y1="155" x2="160" y2="145" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="155" x2="168" y2="155" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>