<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" opacity="0.15"/>
  <defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#A855F7"/></linearGradient></defs>
  <!-- Paint bucket -->
  <g opacity="0.85">
    <rect x="60" y="75" width="50" height="60" rx="4" fill="#7C3AED" opacity="0.8"/>
    <rect x="58" y="70" width="54" height="10" rx="3" fill="#6D28D9" opacity="0.9"/>
    <!-- Paint drip -->
    <path d="M115 90c3-8 8-10 10-5s4 10 0 15-6 8-10 0z" fill="#A855F7" opacity="0.7"/>
    <path d="M115 110c2-5 5-8 7-4s3 8 0 12-4 6-7 0z" fill="#C084FC" opacity="0.5"/>
    <!-- Handle -->
    <path d="M75 70c-2-15 8-22 20-20" stroke="#94A3B8" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Paint roller -->
  <g opacity="0.8" transform="translate(135, 80) rotate(15)">
    <rect x="0" y="0" width="6" height="55" rx="2" fill="#78350F"/>
    <rect x="-4" y="-20" width="14" height="25" rx="3" fill="#C084FC" opacity="0.7"/>
    <rect x="-2" y="-18" width="10" height="21" rx="2" fill="#A855F7" opacity="0.5"/>
  </g>
  <!-- Paint brush -->
  <g opacity="0.6" transform="translate(45, 45) rotate(-30)">
    <rect x="0" y="0" width="5" height="40" rx="2" fill="#78350F"/>
    <rect x="-3" y="-12" width="11" height="15" rx="2" fill="#C084FC" opacity="0.7"/>
  </g>
  <!-- Color swatches -->
  <g opacity="0.7">
    <rect x="55" y="150" width="22" height="22" rx="5" fill="#DC2626"/>
    <rect x="82" y="150" width="22" height="22" rx="5" fill="#2563EB"/>
    <rect x="109" y="150" width="22" height="22" rx="5" fill="#059669"/>
    <rect x="136" y="150" width="22" height="22" rx="5" fill="#EAB308"/>
  </g>
  <!-- Splatter dots -->
  <g opacity="0.25">
    <circle cx="40" cy="130" r="3" fill="#DC2626"/>
    <circle cx="155" cy="145" r="2.5" fill="#2563EB"/>
    <circle cx="50" cy="165" r="2" fill="#059669"/>
  </g>
</svg>