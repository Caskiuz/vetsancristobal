<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <pattern id="steaks2" x="0" y="0" width="250" height="250" patternUnits="userSpaceOnUse">
      <ellipse cx="80" cy="80" rx="35" ry="22" fill="#B91C1C" opacity="0.18" transform="rotate(-15 80 80)"/>
      <path d="M70 85 L90 78" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" opacity="0.22"/>
      <ellipse cx="55" cy="72" rx="12" ry="8" fill="#DC2626" opacity="0.15" transform="rotate(-30 55 72)"/>
      <ellipse cx="200" cy="180" rx="28" ry="20" fill="#991B1B" opacity="0.14" transform="rotate(10 200 180)"/>
      <rect x="218" y="162" width="7" height="52" rx="2" fill="#991B1B" opacity="0.16" transform="rotate(10 218 162)"/>
    </pattern>
    <pattern id="grill2" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#F59E0B" stroke-width="1" opacity="0.15"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#F59E0B" stroke-width="1" opacity="0.15"/>
    </pattern>
    <linearGradient id="carneGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="carneGradB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#carneGradA)"/>
  <rect width="1200" height="800" fill="url(#carneGradB)"/>
  <rect width="1200" height="800" fill="url(#steaks2)"/>
  <rect width="1200" height="800" fill="url(#grill2)"/>
  <!-- Cow silhouette -->
  <g opacity="0.12">
    <ellipse cx="920" cy="500" rx="160" ry="110" fill="#B91C1C"/>
    <ellipse cx="860" cy="410" rx="65" ry="45" fill="#B91C1C"/>
    <ellipse cx="1000" cy="425" rx="45" ry="32" fill="#B91C1C"/>
    <path d="M820 390c-18-35-48-48-70-35" stroke="#B91C1C" stroke-width="4" stroke-linecap="round"/>
    <path d="M900 390c18-35 48-48 70-35" stroke="#B91C1C" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Pig silhouette -->
  <g opacity="0.10">
    <ellipse cx="250" cy="350" rx="100" ry="70" fill="#DC2626"/>
    <circle cx="185" cy="315" r="33" fill="#DC2626"/>
    <ellipse cx="152" cy="308" rx="12" ry="9" fill="#DC2626"/>
  </g>
  <!-- Chicken silhouette -->
  <g opacity="0.10">
    <ellipse cx="300" cy="620" rx="55" ry="38" fill="#F59E0B"/>
    <circle cx="275" cy="585" r="20" fill="#F59E0B"/>
    <path d="M262 578c-6-12 0-22 13-18" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Meat cuts diagram -->
  <g opacity="0.10">
    <line x1="520" y1="150" x2="720" y2="320" stroke="#B91C1C" stroke-width="2"/>
    <line x1="720" y1="150" x2="560" y2="320" stroke="#B91C1C" stroke-width="2"/>
    <line x1="620" y1="150" x2="620" y2="320" stroke="#B91C1C" stroke-width="1.5"/>
    <circle cx="570" cy="190" r="4" fill="#B91C1C"/>
    <circle cx="660" cy="230" r="3.5" fill="#B91C1C"/>
    <circle cx="605" cy="275" r="4" fill="#B91C1C"/>
    <circle cx="680" cy="190" r="3" fill="#B91C1C"/>
  </g>
</svg>