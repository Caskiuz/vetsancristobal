<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="carneGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#B91C1C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="carneGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="600" cy="500" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="marble" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M30 30c3-5 8-8 12-3s5 10 0 15c-3 3-8 4-12 0" stroke="#B91C1C" stroke-width="1" opacity="0.12" fill="none"/>
      <path d="M80 80c-2 4-6 6-10 2s-4-8 0-12c3-3 7-3 10 0" stroke="#DC2626" stroke-width="1" opacity="0.10" fill="none"/>
      <circle cx="20" cy="90" r="1.5" fill="#FCA5A5" opacity="0.15"/>
      <circle cx="100" cy="40" r="2" fill="#FCA5A5" opacity="0.12"/>
    </pattern>
    <pattern id="grillMarks" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="15" x2="30" y2="15" stroke="#F59E0B" stroke-width="0.6" opacity="0.10"/>
    </pattern>
    <!-- Steak cut diagram -->
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#carneGrad1)"/>
  <rect width="1200" height="800" fill="url(#carneGrad2)"/>
  <rect width="1200" height="800" fill="url(#fireGlow)"/>
  <rect width="1200" height="800" fill="url(#marble)"/>
  <rect width="1200" height="800" fill="url(#grillMarks)"/>
  
  <!-- Curved wave bottom -->
  <path d="M0 600 Q300 560 600 610 Q900 660 1200 590 L1200 800 L0 800 Z" fill="#B91C1C" opacity="0.03"/>
  
  <!-- Left: Cow illustration -->
  <g transform="translate(180, 280)" opacity="0.55">
    <ellipse cx="20" cy="70" rx="80" ry="65" fill="#B91C1C"/>
    <ellipse cx="-10" cy="0" rx="45" ry="38" fill="#B91C1C"/>
    <ellipse cx="60" cy="10" rx="30" ry="25" fill="#991B1B" opacity="0.6"/>
    <!-- Horns -->
    <path d="M-30 -25c-12-25-32-35-50-25" stroke="#B91C1C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M10 -30c8-22 25-32 40-22" stroke="#B91C1C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-22" cy="-8" r="5" fill="#FEF2F2" opacity="0.8"/>
    <circle cx="-22" cy="-8" r="2.5" fill="#7F1D1D"/>
    <circle cx="36" cy="-5" r="5" fill="#FEF2F2" opacity="0.8"/>
    <circle cx="36" cy="-5" r="2.5" fill="#7F1D1D"/>
    <!-- Snout -->
    <ellipse cx="5" cy="18" rx="20" ry="15" fill="#FCA5A5" opacity="0.35"/>
    <circle cx="-3" cy="14" r="4" fill="#991B1B" opacity="0.4"/>
    <circle cx="13" cy="14" r="4" fill="#991B1B" opacity="0.4"/>
    <!-- Legs -->
    <rect x="-20" y="130" width="12" height="50" rx="6" fill="#B91C1C"/>
    <rect x="40" y="130" width="12" height="50" rx="6" fill="#B91C1C"/>
    <rect x="15" y="130" width="12" height="45" rx="6" fill="#991B1B" opacity="0.6"/>
    <!-- Tail -->
    <path d="M100 55 Q130 40 140 60 Q150 80 135 90" stroke="#991B1B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Spots -->
    <ellipse cx="0" cy="50" rx="15" ry="10" fill="#991B1B" opacity="0.5"/>
    <ellipse cx="50" cy="90" rx="12" ry="8" fill="#991B1B" opacity="0.4"/>
    <ellipse cx="30" cy="60" rx="10" ry="7" fill="#991B1B" opacity="0.3"/>
  </g>
  
  <!-- Right: Pig illustration -->
  <g transform="translate(980, 300)" opacity="0.55">
    <ellipse cx="0" cy="60" rx="65" ry="50" fill="#DC2626"/>
    <circle cx="-5" cy="10" r="28" fill="#DC2626"/>
    <!-- Ears -->
    <ellipse cx="-30" cy="-8" rx="12" ry="8" fill="#DC2626" transform="rotate(-30 -30 -8)"/>
    <ellipse cx="20" cy="-8" rx="12" ry="8" fill="#DC2626" transform="rotate(30 20 -8)"/>
    <!-- Eyes -->
    <circle cx="-15" cy="0" r="4.5" fill="#FEF2F2" opacity="0.8"/>
    <circle cx="-15" cy="0" r="2" fill="#7F1D1D"/>
    <circle cx="12" cy="0" r="4.5" fill="#FEF2F2" opacity="0.8"/>
    <circle cx="12" cy="0" r="2" fill="#7F1D1D"/>
    <!-- Snout -->
    <ellipse cx="-2" cy="18" rx="14" ry="10" fill="#FCA5A5" opacity="0.4"/>
    <circle cx="-6" cy="16" r="2.5" fill="#991B1B" opacity="0.5"/>
    <circle cx="4" cy="16" r="2.5" fill="#991B1B" opacity="0.5"/>
    <!-- Legs -->
    <rect x="-25" y="105" width="10" height="40" rx="5" fill="#DC2626"/>
    <rect x="20" y="105" width="10" height="40" rx="5" fill="#DC2626"/>
    <!-- Curly tail -->
    <path d="M65 45 Q85 30 90 50 Q95 70 80 75" stroke="#DC2626" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Center: Butcher diagram / Meat cuts visualization -->
  <g transform="translate(580, 360)" opacity="0.70">
    <!-- Butcher block -->
    <rect x="-90" y="90" width="180" height="18" rx="4" fill="#78350F" opacity="0.7"/>
    <rect x="-95" y="105" width="190" height="8" rx="2" fill="#451A03" opacity="0.5"/>
    
    <!-- Beef cut diagram (simplified) -->
    <path d="M-50 -80 Q-30 -100 0 -90 Q30 -80 50 -60 Q60 -30 40 0 Q20 30 0 60 Q-20 30-40 0 Q-60 -30 -50 -80" fill="none" stroke="#DC2626" stroke-width="3"/>
    
    <!-- Cut lines -->
    <line x1="-20" y1="-70" x2="-15" y2="60" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="15" y1="-65" x2="10" y2="55" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <circle cx="-35" cy="-20" r="4" fill="#B91C1C" opacity="0.7"/>
    <circle cx="30" cy="10" r="3.5" fill="#B91C1C" opacity="0.6"/>
    <circle cx="-5" cy="-50" r="3" fill="#DC2626" opacity="0.6"/>
    <circle cx="20" cy="-30" r="2.5" fill="#DC2626" opacity="0.5"/>
    
    <!-- Labels as dots -->
    <text x="-55" y="-40" font-family="Arial" font-size="8" fill="#FCA5A5" opacity="0.5">LOMITO</text>
    <text x="35" y="-15" font-family="Arial" font-size="7" fill="#FCA5A5" opacity="0.4">SOLOMO</text>
    <text x="-10" y="80" font-family="Arial" font-size="7" fill="#FCA5A5" opacity="0.35">PUNTA</text>
    
    <!-- Butcher knives crossed -->
    <g transform="translate(-80, -20) rotate(-35)">
      <rect x="0" y="0" width="6" height="60" rx="2" fill="#94A3B8" opacity="0.8"/>
      <rect x="2" y="2" width="2" height="55" rx="1" fill="#CBD5E1" opacity="0.5"/>
      <rect x="2" y="-10" width="2" height="12" rx="1" fill="#F59E0B" opacity="0.7"/>
    </g>
    <g transform="translate(75, -25) rotate(35)">
      <rect x="0" y="0" width="7" height="55" rx="2" fill="#94A3B8" opacity="0.8"/>
      <rect x="2" y="2" width="3" height="50" rx="1" fill="#CBD5E1" opacity="0.5"/>
      <rect x="2" y="-10" width="3" height="12" rx="1" fill="#F59E0B" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Top decorative: Hanging sausages -->
  <g opacity="0.35">
    <line x1="300" y1="20" x2="300" y2="50" stroke="#94A3B8" stroke-width="1"/>
    <line x1="500" y1="20" x2="500" y2="55" stroke="#94A3B8" stroke-width="1"/>
    <line x1="750" y1="20" x2="750" y2="50" stroke="#94A3B8" stroke-width="1"/>
    <!-- Sausages -->
    <rect x="290" y="50" width="20" height="8" rx="4" fill="#B91C1C" opacity="0.7" transform="rotate(5 300 54)"/>
    <rect x="290" y="62" width="20" height="8" rx="4" fill="#DC2626" opacity="0.7" transform="rotate(-3 300 66)"/>
    <rect x="490" y="55" width="20" height="8" rx="4" fill="#991B1B" opacity="0.7" transform="rotate(8 500 59)"/>
    <rect x="490" y="67" width="20" height="8" rx="4" fill="#B91C1C" opacity="0.6" transform="rotate(-2 500 71)"/>
    <rect x="740" y="50" width="20" height="8" rx="4" fill="#DC2626" opacity="0.7" transform="rotate(-5 750 54)"/>
  </g>

  <!-- Chicken silhouette small -->
  <g transform="translate(350, 630)" opacity="0.3">
    <ellipse cx="0" cy="15" rx="30" ry="22" fill="#F59E0B"/>
    <circle cx="-22" cy="-5" r="12" fill="#F59E0B"/>
    <path d="M-32 -8 L-45 -18 L-28 -12" fill="#F59E0B"/>
    <circle cx="-25" cy="-8" r="2" fill="#FFFBEB" opacity="0.6"/>
  </g>

  <!-- Grill/fire sparks -->
  <circle cx="200" cy="200" r="3" fill="#F59E0B" opacity="0.12"/>
  <circle cx="900" cy="180" r="4" fill="#F97316" opacity="0.10"/>
  <circle cx="1100" cy="250" r="2.5" fill="#F59E0B" opacity="0.08"/>
  <circle cx="100" cy="550" r="3" fill="#DC2626" opacity="0.06"/>
</svg>