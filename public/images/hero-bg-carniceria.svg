<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <pattern id="steaks" x="0" y="0" width="250" height="250" patternUnits="userSpaceOnUse">
      <!-- TBone steak shape -->
      <ellipse cx="80" cy="80" rx="35" ry="22" fill="#B91C1C" opacity="0.06" transform="rotate(-15 80 80)"/>
      <path d="M70 85 L90 78" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" opacity="0.08"/>
      <ellipse cx="55" cy="72" rx="12" ry="8" fill="#DC2626" opacity="0.05" transform="rotate(-30 55 72)"/>
      <!-- Chop shape -->
      <ellipse cx="200" cy="180" rx="28" ry="20" fill="#991B1B" opacity="0.05" transform="rotate(10 200 180)"/>
      <rect x="218" y="162" width="6" height="50" rx="2" fill="#991B1B" opacity="0.06" transform="rotate(10 218 162)"/>
    </pattern>
    <pattern id="grill" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#F59E0B" stroke-width="0.5" opacity="0.06"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#F59E0B" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <linearGradient id="carneGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="carneGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#carneGrad1)"/>
  <rect width="1200" height="800" fill="url(#carneGrad2)"/>
  <rect width="1200" height="800" fill="url(#steaks)"/>
  <rect width="1200" height="800" fill="url(#grill)"/>
  <!-- Cow silhouette decorative -->
  <ellipse cx="900" cy="500" rx="150" ry="100" fill="#B91C1C" opacity="0.04"/>
  <ellipse cx="850" cy="420" rx="60" ry="40" fill="#B91C1C" opacity="0.04"/>
  <ellipse cx="980" cy="430" rx="40" ry="30" fill="#B91C1C" opacity="0.03"/>
  <!-- Horns -->
  <path d="M820 400c-15-30-40-40-60-30" stroke="#B91C1C" stroke-width="3" stroke-linecap="round" opacity="0.05"/>
  <path d="M880 400c15-30 40-40 60-30" stroke="#B91C1C" stroke-width="3" stroke-linecap="round" opacity="0.05"/>
  <!-- Pig silhouette -->
  <ellipse cx="250" cy="350" rx="90" ry="65" fill="#DC2626" opacity="0.04"/>
  <circle cx="190" cy="320" r="30" fill="#DC2626" opacity="0.04"/>
  <ellipse cx="160" cy="310" rx="10" ry="8" fill="#DC2626" opacity="0.03"/>
  <!-- Chicken silhouette -->
  <ellipse cx="300" cy="600" rx="50" ry="35" fill="#F59E0B" opacity="0.04"/>
  <circle cx="280" cy="570" r="18" fill="#F59E0B" opacity="0.04"/>
  <path d="M270 565c-5-10 0-18 10-15" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.04"/>
  <!-- Cuts diagram lines -->
  <g opacity="0.04">
    <line x1="500" y1="150" x2="700" y2="300" stroke="#B91C1C" stroke-width="1.5"/>
    <line x1="700" y1="150" x2="550" y2="300" stroke="#B91C1C" stroke-width="1.5"/>
    <line x1="520" y1="200" x2="680" y2="250" stroke="#B91C1C" stroke-width="1"/>
    <line x1="600" y1="150" x2="600" y2="300" stroke="#B91C1C" stroke-width="1"/>
    <circle cx="560" cy="180" r="3" fill="#B91C1C"/>
    <circle cx="640" cy="220" r="2.5" fill="#B91C1C"/>
    <circle cx="590" cy="260" r="3" fill="#B91C1C"/>
    <circle cx="660" cy="180" r="2" fill="#B91C1C"/>
  </g>
</svg>